<!DOCTYPE html>

    <head>
        <title>Mademoiselle</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <meta name="author" content="Dragan Matijevic">
        <meta name="description" content="Mademoiselle is homework project from SASS-Bootstrap class">
        <meta name="keywords" content="Day and night makeup, Mademoiselle, haircut, wax, makeup, lip with hyaluronum">

        <!--ios compatibility-->
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-title" content="Mademoiselle">
        <link rel="apple-touch-icon" href="apple-icon-144x144.png">


        <!--Android compatibility-->
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="application-name" content="Mademoiselle">
        <link rel="icon" type="image/png" href="android-icon-192x192.png">



        <!-- CSS Files -->
        <link href="css/theme.css" rel="stylesheet" type="text/css"/>

    <body>



        <header class="py-3 py-lg-5 bg-white">
            <nav class="navbar navbar-expand-lg">
                <div class="container">
                    <a class="navbar-brand" href="#">
                        <img src="images/logo.png" alt="logo"/>
                    </a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-menu" aria-controls="main-menu" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="main-menu">
                        <ul class="navbar-nav text-center align-items-lg-center ms-auto pt-3 pt-lg-0">
                            <li class="nav-item">
                                <a class="nav-link active text-uppercase" aria-current="page" href="#">about</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link text-uppercase" href="#">services</a>
                            </li>
                            <li class="nav-item">

        <main>

                <div class='container'>
                    <div class='row justify-content-center'>
                        <div class='col-12 col-md-9 col-lg-6 col-xl-4'>
                            <article class='herro-content animation' data-animation="slide-top">

                                    Welcome to  Mademoiselle

        <script src="js/jquery.js" type="text/javascript"></script>
